on:
  schedule:
    - cron: '5 * * * *'  # every hour, at minute 0 UTC

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run stat script
        run: |
          python update_stats.py  # updates README
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "[email protected]"
          git add README.md
          git commit -m "chore: update stats" || echo "No changes"
          git push
